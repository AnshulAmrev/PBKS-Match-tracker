<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🏏 PBKS IPL Ticket Tracker</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app">
    <!-- Header -->
    <header class="header">
      <div class="header-content">
        <div class="logo-section">
          <div class="team-badge">PBKS</div>
          <div>
            <h1>Punjab Kings</h1>
            <p class="subtitle">IPL 2026 Ticket Tracker</p>
          </div>
        </div>
        <div class="header-actions">
          <div class="auto-refresh-toggle">
            <label class="toggle-label">
              <input type="checkbox" id="autoRefreshToggle" checked>
              <span class="toggle-slider"></span>
              Auto-refresh
            </label>
            <span class="refresh-interval" id="refreshCountdown">Next check in 5:00</span>
          </div>
          <button class="btn-refresh" id="refreshAllBtn" title="Check all matches now">
            <span class="refresh-icon">↻</span> Check Now
          </button>
          <button class="btn-notify" id="enableNotificationsBtn" title="Enable browser notifications">
            🔔 Enable Alerts
          </button>
          <button class="btn-notify" id="testEmailBtn" title="Send test email" style="background: var(--bg-card); border: 1px solid var(--border);">
            📧 Test Email
          </button>
        </div>
      </div>
    </header>

    <!-- Status Banner -->
    <div class="status-banner" id="statusBanner">
      <span class="status-icon">📡</span>
      <span id="statusText">Connecting to tracker...</span>
    </div>

    <!-- Match Grid -->
    <main class="match-grid" id="matchGrid">
      <!-- Cards will be injected by JS -->
      <div class="loading">
        <div class="spinner"></div>
        <p>Loading match schedule...</p>
      </div>
    </main>

    <!-- Footer -->
    <footer class="footer">
      <p>Data sourced from <a href="https://district.in" target="_blank">district.in</a> • Unofficial tracker • Not affiliated with Zomato or BCCI</p>
      <p class="footer-tip">💡 Tip: Keep this tab open to receive instant notifications when tickets go on sale!</p>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
